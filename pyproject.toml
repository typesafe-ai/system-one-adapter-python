[project]
name = "open-system-one"
version = "0.1.0"
description = "Drop-in TypeSafeClient replacement backed by LLM APIs via PydanticAI"
readme = "README.md"
authors = [
    { name = "Erik Gafni", email = "erik@typesafe.ai" }
]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.121.0",
    "openai>=2.53.0",
    "pydantic-ai>=2.27.0",
    "typesafe-sdk>=0.5.7,<0.6",
]

[project.urls]
Repository = "https://github.com/typesafe-ai/OpenSystemOne"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-recording>=0.13.4",
    "ruff>=0.14.14",
]

[tool.uv.build-backend]
module-name = "open_system_one"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Fail rather than silently making a live call when a cassette is missing. Passing
# --record-mode (anything but "none") lifts this for cassette-backed tests.
addopts = "--block-network"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "BLE",  # blind except
    "C4",   # comprehensions
    "SIM",  # simplify
    "RUF",  # ruff-specific
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"
