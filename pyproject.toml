[project]
name = "opentypesafe2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Erik Gafni", email = "erik@typesafe.ai" }
]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.121.0",
    "openai>=2.53.0",
    "pydantic-ai>=2.27.0",
    "typesafe-client>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.14.14",
]

[[tool.uv.index]]
name = "typesafe"
url = "https://pypi.typesafe.ai/"

[tool.uv.build-backend]
module-name = "open_typesafe_client"

[tool.ruff]
target-version = "py311"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"
